
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAHILANG EDITOR</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#101322;
 color:white;
 font-family:Arial,sans-serif;
}
header{
 background:#202844;
 padding:18px;
 text-align:center;
 font-size:24px;
 font-weight:bold;
 color:#55e6ff;
}
.container{padding:15px;max-width:850px;margin:auto}
.panel{
 background:#202844;
 padding:15px;
 border-radius:13px;
 margin-bottom:15px;
}
h3{color:#55e6ff}
button,.upload{
 background:#087eeb;
 border:0;
 padding:12px;
 color:white;
 border-radius:8px;
 cursor:pointer;
 font-size:15px;
 margin:4px 0;
}
input,select,textarea{
 width:100%;
 padding:12px;
 margin:7px 0;
 border-radius:7px;
 border:1px solid #52617e;
 background:#11182a;
 color:white;
}
textarea{height:100px}
canvas{
 width:100%;
 background:black;
 border-radius:10px;
}
.photo{
 display:flex;
 align-items:center;
 gap:8px;
 padding:8px;
 background:#303b58;
 margin:7px 0;
 border-radius:8px;
}
.photo img{
 width:55px;
 height:55px;
 object-fit:cover;
 border-radius:5px;
}
.photo button{padding:7px}
.green{background:#138b53}
.red{background:#d34444}
#status{color:#75f5ad;font-size:14px}
</style>
</head>

<body>

<header>🎬 MAHILANG EDITOR</header>

<div class="container">

<div class="panel">
<h3>📸 अपनी फोटो अपलोड करें</h3>
<input type="file" id="files" accept="image/*" multiple>
<div id="photoList"></div>
</div>

<div class="panel">
<h3>🎞️ वीडियो सेटिंग</h3>

<label>वीडियो का आकार</label>
<select id="ratio">
<option value="16:9">16:9 YouTube</option>
<option value="9:16">9:16 Reels / Shorts</option>
</select>

<label>वीडियो की कुल अवधि (सेकंड)</label>
<input type="number" id="duration" value="60" min="1" max="600">

<label>फोटो बदलने का तरीका</label>
<select id="transition">
<option value="fade">Fade Effect</option>
<option value="normal">Normal</option>
</select>

<label>वीडियो पर टेक्स्ट</label>
<input id="caption" placeholder="यहाँ वीडियो का टाइटल लिखें">
</div>

<div class="panel">
<h3>🎙️ हिंदी Voice Studio</h3>
<textarea id="script" placeholder="अपनी हिंदी कहानी या स्क्रिप्ट यहाँ लिखें..."></textarea>

<label>हिंदी आवाज चुनें</label>
<select id="voice"></select>

<button class="green" onclick="speakText()">🔊 आवाज सुनें</button>
<button class="red" onclick="stopVoice()">आवाज बंद करें</button>

<p style="font-size:13px;color:#ccc">
नोट: यह शुरुआती संस्करण आपके ब्राउज़र में उपलब्ध हिंदी आवाज का इस्तेमाल करता है। असली AI Voice और वीडियो में आवाज मिलाने के लिए अगले चरण में TTS सर्वर जोड़ेंगे।
</p>
</div>

<div class="panel">
<h3>👁️ वीडियो प्रीव्यू</h3>
<canvas id="canvas" width="1280" height="720"></canvas>
<button onclick="previewVideo()">▶️ Preview देखें</button>
<button class="green" onclick="exportVideo()">⬇️ वीडियो बनाएं और डाउनलोड करें</button>
<p id="status">अपनी फोटो अपलोड करके शुरू करें।</p>
</div>

</div>

<script>
const filesInput=document.getElementById("files");
const photoList=document.getElementById("photoList");
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

let photos=[];
let playing=false;
let voices=[];

filesInput.addEventListener("change",e=>{
 const selected=Array.from(e.target.files);

 selected.forEach(file=>{
  if(!file.type.startsWith("image/"))return;

  const url=URL.createObjectURL(file);
  const img=new Image();

  img.onload=()=>{
   photos.push({img,url,name:file.name});
   showPhotos();
   drawPhoto(0);
  };

  img.src=url;
 });

 filesInput.value="";
});

function showPhotos(){
 photoList.innerHTML="";

 photos.forEach((p,i)=>{
  const div=document.createElement("div");
  div.className="photo";

  const img=document.createElement("img");
  img.src=p.url;

  const name=document.createElement("span");
  name.textContent=(i+1)+". "+p.name;
  name.style.flex="1";

  const up=document.createElement("button");
  up.textContent="↑";
  up.onclick=()=>movePhoto(i,-1);

  const down=document.createElement("button");
  down.textContent="↓";
  down.onclick=()=>movePhoto(i,1);

  const del=document.createElement("button");
  del.textContent="✕";
  del.className="red";
  del.onclick=()=>removePhoto(i);

  div.append(img,name,up,down,del);
  photoList.appendChild(div);
 });
}

function movePhoto(i,step){
 const j=i+step;
 if(j<0||j>=photos.length)return;
 [photos[i],photos[j]]=[photos[j],photos[i]];
 showPhotos();
}

function removePhoto(i){
 URL.revokeObjectURL(photos[i].url);
 photos.splice(i,1);
 showPhotos();
 if(photos.length)drawPhoto(0);
 else ctx.clearRect(0,0,canvas.width,canvas.height);
}

function setupCanvas(){
 if(document.getElementById("ratio").value==="9:16"){
  canvas.width=720;
  canvas.height=1280;
 }else{
  canvas.width=1280;
  canvas.height=720;
 }
}

function drawPhoto(index,alpha=1){
 if(!photos.length)return;

 const img=photos[index].img;
 const w=canvas.width;
 const h=canvas.height;

 ctx.fillStyle="black";
 ctx.fillRect(0,0,w,h);

 const scale=Math.max(w/img.width,h/img.height);
 const iw=img.width*scale;
 const ih=img.height*scale;

 ctx.save();
 ctx.globalAlpha=alpha;
 ctx.drawImage(img,(w-iw)/2,(h-ih)/2,iw,ih);
 ctx.restore();

 const title=document.getElementById("caption").value;

 if(title){
  ctx.fillStyle="rgba(0,0,0,.55)";
  ctx.fillRect(0,h-100,w,100);
  ctx.fillStyle="white";
  ctx.font="bold 38px Arial";
  ctx.textAlign="center";
  ctx.fillText(title,w/2,h-40,w-50);
 }
}

function previewVideo(){
 if(!photos.length){
  alert("पहले फोटो अपलोड करें");
  return;
 }

 setupCanvas();
 drawPhoto(0);

 let i=0;
 playing=true;

 const delay=3000;

 function next(){
  if(!playing||i>=photos.length-1)return;
  i++;
  drawPhoto(i);
  setTimeout(next,delay);
 }

 setTimeout(next,delay);
}

function speakText(){
 const text=document.getElementById("script").value;

 if(!text.trim()){
  alert("पहले हिंदी स्क्रिप्ट लिखें");
  return;
 }

 if(!("speechSynthesis" in window)){
  alert("आपके ब्राउज़र में Voice सुविधा उपलब्ध नहीं है");
  return;
 }

 speechSynthesis.cancel();

 const msg=new SpeechSynthesisUtterance(text);
 msg.lang="hi-IN";
 msg.rate=1;
 msg.pitch=1;

 const selected=document.getElementById("voice").value;
 if(selected!==""){
  msg.voice=voices[Number(selected)];
 }

 speechSynthesis.speak(msg);
}

function stopVoice(){
 speechSynthesis.cancel();
}

function loadVoices(){
 voices=speechSynthesis.getVoices();
 const select=document.getElementById("voice");
 select.innerHTML="";

 const hindi=voices
  .map((v,i)=>({v,i}))
  .filter(x=>x.v.lang.toLowerCase().startsWith("hi"));

 if(!hindi.length){
  const opt=document.createElement("option");
  opt.textContent="डिफॉल्ट ब्राउज़र आवाज";
  opt.value="";
  select.appendChild(opt);
  return;
 }

 hindi.forEach(x=>{
  const opt=document.createElement("option");
  opt.value=x.i;
  opt.textContent=x.v.name;
  select.appendChild(opt);
 });
}

if("speechSynthesis" in window){
 loadVoices();
 speechSynthesis.onvoiceschanged=loadVoices;
}

function exportVideo(){
 if(!photos.length){
  alert("पहले फोटो अपलोड करें");
  return;
 }

 if(!window.MediaRecorder){
  alert("इस ब्राउज़र में वीडियो रिकॉर्डिंग उपलब्ध नहीं है");
  return;
 }

 setupCanvas();

 const seconds=Number(document.getElementById("duration").value);

 if(!Number.isFinite(seconds)||seconds<=0||seconds>600){
  alert("अवधि 1 से 600 सेकंड के बीच रखें");
  return;
 }

 const mime=MediaRecorder.isTypeSupported("video/webm;codecs=vp9")
  ?"video/webm;codecs=vp9":"video/webm";

 const stream=canvas.captureStream(25);
 const recorder=new MediaRecorder(stream,{mimeType:mime});
 const chunks=[];

 recorder.ondataavailable=e=>{
  if(e.data.size)chunks.push(e.data);
 };

 recorder.onstop=()=>{
  const blob=new Blob(chunks,{type:"video/webm"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download="MAHILANG-EDITOR.webm";
  a.click();

  setTimeout(()=>URL.revokeObjectURL(url),60000);

  document.getElementById("status").textContent=
   "आपका वीडियो डाउनलोड हो गया!";
 };

 const photoDuration=seconds/photos.length;
 let index=0;
 let start=performance.now();

 document.getElementById("status").textContent=
  "वीडियो तैयार हो रहा है... मोबाइल का पेज खुला रखें।";

 drawPhoto(0);
 recorder.start(500);

 function frame(now){
  if(index>=photos.length){
   if(recorder.state==="recording")recorder.stop();
   return;
  }

  const elapsed=now-start;
  const progress=elapsed/photoDuration;

  if(progress>=1){
   index++;
   start=now;
   if(index<photos.length)drawPhoto(index);
  }

  if(index<photos.length){
   requestAnimationFrame(frame);
  }else if(recorder.state==="recording"){
   recorder.stop();
  }
 }

 requestAnimationFrame(frame);
}
</script>

</body>
</html>
